# Dotfiles Standard tmux Configuration
# Sourced via ~/.tmux.conf symlink

# 1. General & Mouse Options
set -g mouse on
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"
set -s escape-time 0
set -g history-limit 50000

# 2. Window and Pane Indexing (1-based for human keyboard ergonomics)
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# 3. Intuitive Window Splitting (inherits current working directory)
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# 4. Vim-style Pane Navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# 5. Quick Reload Shortcut
bind r source-file ~/.tmux.conf \; display-message "✓ Reloaded ~/.tmux.conf"

# 6. Minimal Status Bar
set -g status-position bottom
set -g status-style bg=default,fg=colour245
set -g status-left-length 40
set -g status-left "#[fg=colour75,bold] ❐ #S #[default] "
set -g status-right "#[fg=colour245]%Y-%m-%d %H:%M #[default]"
setw -g window-status-current-style fg=colour75,bold
